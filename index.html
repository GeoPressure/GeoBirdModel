<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bird Models · GeoPressure</title>
<meta name="description" content="3D flying models of geolocator-tracked bird species, made for GeoLocator Explorer. CC BY 4.0.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root {
  --bg: #f4f1ea; --ink: #1b2230; --muted: #646b78; --line: #ddd6c8; --tile: #ebe6db; --field: #fffdf8;
  --stage: radial-gradient(120% 90% at 50% 35%, #fbf9f4 0%, #e9e3d6 100%);
  --accent: #1f6f5c; --accent-ink: #fff; --glass: rgba(255, 253, 248, .82);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1319; --ink: #eef0f3; --muted: #98a1ae; --line: #252d38; --tile: #171d26; --field: #141a22;
    --stage: radial-gradient(120% 90% at 50% 35%, #1e2631 0%, #0f1319 100%);
    --accent: #5fc2a6; --accent-ink: #0d1a16; --glass: rgba(20, 26, 34, .78);
  }
}
:root[data-theme="dark"] {
  --bg: #0f1319; --ink: #eef0f3; --muted: #98a1ae; --line: #252d38; --tile: #171d26; --field: #141a22;
  --stage: radial-gradient(120% 90% at 50% 35%, #1e2631 0%, #0f1319 100%);
  --accent: #5fc2a6; --accent-ink: #0d1a16; --glass: rgba(20, 26, 34, .78);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 Sora, system-ui, sans-serif; }
a { color: inherit; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex-wrap: wrap; }
.top h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .01em; }
.top .sp { flex: 1; }
.top .count { font-size: 12px; color: var(--muted); }
.top a.explorer { font-size: 13px; color: var(--muted); text-decoration: none; }
.top a.explorer:hover { color: var(--accent); }
input[type=search] { font: inherit; font-size: 13px; color: var(--ink); background: var(--field); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 14px; width: min(260px, 100%); }
input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

.stage { position: relative; background: var(--stage); }
model-viewer { width: 100%; height: min(66vh, 660px); --poster-color: transparent; background: transparent; }
.stage .big { display: none; height: min(66vh, 660px); width: 100%; object-fit: contain; padding: 32px; opacity: .8; }
.stage.missing model-viewer, .stage.missing .ctrl { display: none; }
.stage.missing .big { display: block; }
.label { position: absolute; left: 16px; bottom: 16px; max-width: min(560px, 60%); }
.label .en { font-size: clamp(22px, 3.2vw, 34px); font-weight: 600; letter-spacing: -.01em; line-height: 1.1; }
.label .sci { font-style: italic; color: var(--muted); font-size: 15px; }
.label .links { margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.label .links a { color: var(--accent); text-decoration: none; }
.label .links a:hover { text-decoration: underline; }
.label .note { margin-top: 6px; font-size: 12px; color: var(--muted); }

.ctrl { position: absolute; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; background: var(--glass); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:disabled { opacity: .4; cursor: default; }
.icon { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 999px; background: var(--glass);
  backdrop-filter: blur(8px); border: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.icon:hover { border-color: var(--accent); color: var(--accent); }
.icon svg { width: 18px; height: 18px; }
.thumb { width: 52px; height: 52px; border-radius: 12px; overflow: hidden; background: #fff; border: 1px solid var(--line); display: block; }
.thumb img { width: 100%; height: 100%; object-fit: contain; }

.chips { display: none; gap: 6px; flex-wrap: wrap; padding: 12px 16px 0; }
body.internal .chips { display: flex; }
.chips button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--tile); color: var(--ink); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.chips button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 12px 16px 8px; }
.tile { position: relative; border: 1px solid transparent; background: var(--tile); border-radius: 12px; padding: 6px 6px 8px; cursor: pointer; color: inherit; font: inherit; text-align: center; }
.tile:hover { border-color: var(--line); }
.tile[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.tile img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; display: block; }
.tile .name { display: block; font-size: 12px; line-height: 1.3; margin-top: 2px; }
.tile.missing img { opacity: .5; filter: grayscale(.5); }
.q, .tier { display: none; }
body.internal .q { display: inline-block; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 6px; color: #fff; }
body.internal .tile .q { position: absolute; top: 6px; left: 6px; }
body.internal .tile .tier { display: block; position: absolute; top: 6px; right: 8px; font-size: 10px; color: var(--muted); }
.q-good { background: #2e7d4f; } .q-ok { background: #b07a12; } .q-pending { background: #3b6fb6; } .q-rerun { background: #b33a3a; } .q-missing { background: #6b7280; }
.empty { padding: 24px 16px; color: var(--muted); display: none; }

footer { padding: 18px 16px 28px; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
footer a { color: var(--muted); }
footer a:hover { color: var(--accent); }
@media (max-width: 640px) {
  model-viewer, .stage .big { height: 56vh; }
  .label { top: 12px; bottom: auto; max-width: none; right: 16px; }
  .ctrl { left: 16px; right: 16px; bottom: 12px; justify-content: space-between; }
  .thumb { display: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  input[type=search] { width: 100%; order: 5; }
}
</style>
</head>
<body>
<div class="top">
  <h1>Bird models</h1>
  <span class="count" id="count"></span>
  <span class="sp"></span>
  <input type="search" id="search" placeholder="Search a species" aria-label="Search a species">
  <a class="explorer" href="https://geopressure.org/GeoLocatorExplorer/">GeoLocator Explorer ↗</a>
</div>

<div class="stage" id="stage">
  <model-viewer id="mv" camera-controls auto-rotate auto-rotate-delay="3000" rotation-per-second="12deg"
    camera-target="0m 0m 0m" camera-orbit="60deg 68deg auto" min-camera-orbit="auto 5deg auto" max-camera-orbit="auto 175deg auto"
    field-of-view="26deg" exposure="1.05" shadow-intensity="0" interaction-prompt="none" touch-action="pan-y"></model-viewer>
  <img class="big" id="big" alt="">
  <div class="label">
    <div class="en" id="en"></div>
    <div class="sci" id="sci"></div>
    <div class="links" id="links"></div>
    <div class="note" id="note"></div>
  </div>
  <div class="ctrl">
    <a class="thumb" id="p-sticker" target="_blank" rel="noopener" title="Source illustration (huashu-bird-sticker)"><img id="i-sticker" alt="Source illustration"></a>
    <div class="seg" role="group" aria-label="Model">
      <button id="v-fly" aria-pressed="true" title="Flapping model, as used in GeoLocator Explorer">In flight</button>
      <button id="v-static" aria-pressed="false" title="The 3D model before animation">Still</button>
    </div>
    <a class="icon" id="dl" download title="Download this model (.glb)" aria-label="Download this model">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    </a>
  </div>
</div>

<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty">No species matches.</div>

<footer>
  <a href="https://geopressure.org/GeoLocatorExplorer/">GeoLocator Explorer</a>
  <span>Illustrations <a href="https://github.com/alchaincyf/huashu-bird-sticker">huashu-bird-sticker</a> (Huashu)</span>
  <span>Species <a href="https://doi.org/10.5281/zenodo.18187092">Master GeoLocator Data Package</a></span>
  <span>3D <a href="https://www.meshy.ai">Meshy</a> + <a href="https://www.blender.org">Blender</a></span>
  <a href="https://github.com/GeoPressure/bird-models">Source &amp; method</a>
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>
</footer>

<script>
// Public view by default. ?internal adds what the maintainers track: status badges, notes,
// missing and planned species, and filters by status.
const internal = new URLSearchParams(location.search).has("internal");
document.body.classList.toggle("internal", internal);
const EXPLORER = "https://geopressure.org/GeoLocatorExplorer/";
const $ = (id) => document.getElementById(id);
const mv = $("mv"), grid = $("grid");
let birds = [], cur = null, kind = "fly", filter = "all";

function show() {
  const fly = kind === "fly" || !cur.static;
  const src = fly ? cur.model : cur.static;
  if (mv.src !== new URL(src, location.href).href) mv.src = src;
  mv.animationName = fly ? "Fly" : null;
  if (fly) mv.play(); else mv.pause();
  $("v-fly").setAttribute("aria-pressed", String(fly));
  $("v-static").setAttribute("aria-pressed", String(!fly));
  $("v-static").disabled = !cur.static;
  $("dl").href = src;
}
function select(b, scroll) {
  cur = b;
  const miss = !b.model;
  $("stage").classList.toggle("missing", miss);
  if (miss) $("big").src = b.sticker;
  $("en").textContent = b.english_name;
  $("sci").textContent = b.scientific_name;
  const n = +b.n_tags || 0;
  $("links").innerHTML = b.tag_id
    ? `<a href="${EXPLORER}tag/${encodeURIComponent(b.tag_id)}" target="_blank" rel="noopener">See it in GeoLocator Explorer ↗</a>`
      + (n ? `<span style="color:var(--muted)">${n} tracked ${n === 1 ? "bird" : "birds"}</span>` : "")
    : "";
  $("note").innerHTML = internal
    ? `<span class="q q-${b.quality}">${b.quality}</span> ${[b.tier ? (b.tier === "P" ? "planned (GeoCollab)" : "tier " + b.tier) : "", b.quality_notes || ""].filter(Boolean).join(" · ")}`
    : "";
  $("i-sticker").src = $("p-sticker").href = b.sticker;
  if (!miss) show();
  grid.querySelectorAll(".tile").forEach((t) => t.setAttribute("aria-current", String(t.dataset.sci === b.scientific_name)));
  history.replaceState(null, "", location.search + "#" + b.scientific_name.replace(/ /g, "_"));
  document.title = `${b.english_name} · Bird Models`;
  if (scroll) window.scrollTo({ top: 0, behavior: "smooth" });
}
function render() {
  const q = $("search").value.trim().toLowerCase();
  const list = birds.filter((b) => (filter === "all" || b.quality === filter || (filter === "planned" && b.tier === "P"))
    && (!q || b.english_name.toLowerCase().includes(q) || b.scientific_name.toLowerCase().includes(q)));
  grid.innerHTML = list.map((b) => `<button class="tile${b.model ? "" : " missing"}" data-sci="${b.scientific_name}" title="${b.scientific_name}">
      <span class="q q-${b.quality}">${b.quality}</span><span class="tier">${b.tier === "P" ? "planned" : b.tier ? "T" + b.tier : ""}</span>
      <img src="${b.poster || b.sticker}" alt="" loading="lazy"><span class="name">${b.english_name}</span></button>`).join("");
  $("empty").style.display = list.length ? "none" : "block";
  if (cur) grid.querySelectorAll(".tile").forEach((t) => t.setAttribute("aria-current", String(t.dataset.sci === cur.scientific_name)));
}
$("v-fly").onclick = () => { kind = "fly"; show(); };
$("v-static").onclick = () => { kind = "static"; show(); };
$("search").oninput = render;
grid.addEventListener("click", (e) => {
  const t = e.target.closest(".tile");
  if (t) select(birds.find((b) => b.scientific_name === t.dataset.sci), true);
});
mv.addEventListener("load", () => { if (kind === "fly") mv.play(); });

Promise.all([fetch("gallery.json", { cache: "no-store" }).then((r) => r.json()), customElements.whenDefined("model-viewer")]).then(([d]) => {
  const order = { good: 0, ok: 1, pending: 2, rerun: 3, missing: 4 };
  birds = d.birds.filter((b) => internal || b.model)
    .sort((a, b) => internal ? ((order[a.quality] ?? 5) - (order[b.quality] ?? 5) || a.english_name.localeCompare(b.english_name))
                             : a.english_name.localeCompare(b.english_name));
  const done = d.birds.filter((b) => b.model).length;
  $("count").textContent = internal
    ? `${done}/${d.birds.length} species modelled · ${d.birds.filter((b) => b.quality === "good" || b.quality === "ok").length} released`
    : `${done} species`;
  if (internal) {
    const groups = ["all", "good", "ok", "pending", "rerun", "missing", "planned"];
    $("chips").innerHTML = groups.map((g) => {
      const n = g === "all" ? birds.length : birds.filter((b) => b.quality === g || (g === "planned" && b.tier === "P")).length;
      return `<button data-f="${g}" aria-pressed="${g === filter}">${g} (${n})</button>`;
    }).join("");
    $("chips").onclick = (e) => {
      const c = e.target.closest("button"); if (!c) return;
      filter = c.dataset.f; $("chips").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === c))); render();
    };
  }
  render();
  const h = decodeURIComponent(location.hash.slice(1)).replace(/_/g, " ");
  const withModel = birds.filter((b) => b.model);
  select(birds.find((b) => b.scientific_name === h) || withModel[Math.floor(Math.random() * withModel.length)], false);
});
</script>
</body>
</html>
