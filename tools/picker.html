<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig Picker</title>
<!-- Local tool: pick the rig options of one species. Open
     http://localhost:8091/tools/picker.html#Genus_species after `make_bird.py options`. -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root { --bg: #f4f1ea; --ink: #1b2230; --muted: #646b78; --line: #ddd6c8; --panel: #ebe6db; --accent: #1f6f5c; --accent-ink: #fff;
  --stage: radial-gradient(120% 90% at 50% 35%, #fbf9f4 0%, #e9e3d6 100%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1319; --ink: #eef0f3; --muted: #98a1ae; --line: #252d38;
  --panel: #171d26; --accent: #5fc2a6; --accent-ink: #0d1a16; --stage: radial-gradient(120% 90% at 50% 35%, #1e2631 0%, #0f1319 100%); } }
:root[data-theme="dark"] { --bg: #0f1319; --ink: #eef0f3; --muted: #98a1ae; --line: #252d38; --panel: #171d26; --accent: #5fc2a6;
  --accent-ink: #0d1a16; --stage: radial-gradient(120% 90% at 50% 35%, #1e2631 0%, #0f1319 100%); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
header { padding: 12px 16px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 16px; } header .sci { color: var(--muted); font-style: italic; }
model-viewer { width: 100%; height: min(62vh, 640px); background: var(--stage); --poster-color: transparent; }
.controls { display: grid; gap: 10px; padding: 12px 16px; max-width: 900px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row .name { width: 90px; color: var(--muted); }
.row .val { min-width: 260px; flex: 1; background: var(--panel); border-radius: 8px; padding: 6px 10px; }
.row .val b { margin-right: 6px; }
.row .val .cur { color: var(--accent); font-size: 12px; margin-left: 6px; }
button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
input[type=range] { width: 200px; }
code { background: var(--panel); padding: 6px 10px; border-radius: 8px; display: inline-block; user-select: all; }
.hint { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header><h1 id="en">Rig picker</h1><span class="sci" id="sci"></span></header>
<model-viewer id="mv" camera-controls autoplay animation-name="Fly" camera-target="0m 0m 0m" camera-orbit="90deg 85deg 1.2m"
  min-camera-orbit="auto 5deg 0.4m" max-camera-orbit="auto 175deg 3m" field-of-view="28deg" exposure="1.05" interaction-prompt="none"></model-viewer>
<div class="controls">
  <div class="row"><span class="name">Belly</span><button data-g="belly" data-d="-1">◀</button>
    <span class="val" id="v-belly"></span><button data-g="belly" data-d="1">▶</button></div>
  <div class="row"><span class="name">Wing beat</span><button data-g="wing" data-d="-1">◀</button>
    <span class="val" id="v-wing"></span><button data-g="wing" data-d="1">▶</button></div>
  <div class="row"><span class="name">Speed</span><input id="speed" type="range" min="0.05" max="1.5" step="0.05" value="0.5">
    <span id="speed-v"></span><button id="pause">Pause</button></div>
  <div class="row"><span class="name">View</span>
    <button data-v="90deg 85deg 1.2m">Side</button><button data-v="0deg 92deg 1.3m">Head-on</button>
    <button data-v="180deg 92deg 1.3m">Behind</button><button data-v="30deg 125deg 1.2m">Below</button>
    <button data-v="-30deg 72deg 1.5m">Bird view</button></div>
  <div class="row"><span class="name">Choice</span><code id="cmd"></code></div>
  <div class="hint">Keys: ← → belly, ↑ ↓ wing beat, space pause. Tell Claude the two codes (e.g. "B0 W1").</div>
</div>
<script>
const $ = (id) => document.getElementById(id), mv = $("mv");
const sp = decodeURIComponent(location.hash.slice(1)) || "";
const set = new URLSearchParams(location.search).get("set") || "options";
const base = `../work/${sp}/${set}/`;
let opt, ib = 0, iw = 0, paused = false;
const label = (o, cur) => `<b>${o.code}</b>${o.label}${o.code === cur ? '<span class="cur">current</span>' : ""}`;
function load() {
  const b = opt.belly[ib], w = opt.wing[iw];
  $("v-belly").innerHTML = label(b, opt.current.belly);
  $("v-wing").innerHTML = label(w, opt.current.wing);
  $("cmd").textContent = `${b.code} ${w.code}`;
  const t = mv.currentTime, orbit = mv.getCameraOrbit ? mv.getCameraOrbit().toString() : null;
  mv.src = base + `${b.code}_${w.code}.glb`;
  mv.addEventListener("load", () => {
    if (orbit) mv.cameraOrbit = orbit;
    mv.animationName = "Fly"; mv.timeScale = +$("speed").value; mv.currentTime = t || 0;
    if (!paused) mv.play();
  }, { once: true });
}
function step(g, d) {
  if (g === "belly") ib = (ib + d + opt.belly.length) % opt.belly.length;
  else iw = (iw + d + opt.wing.length) % opt.wing.length;
  load();
}
document.querySelectorAll("[data-g]").forEach((b) => b.onclick = () => step(b.dataset.g, +b.dataset.d));
document.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => { mv.cameraOrbit = b.dataset.v; });
$("speed").oninput = () => { mv.timeScale = +$("speed").value; $("speed-v").textContent = `${(+$("speed").value).toFixed(2)}×`; };
$("pause").onclick = () => { paused = !paused; paused ? mv.pause() : mv.play(); $("pause").setAttribute("aria-pressed", String(paused)); };
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") step("belly", -1); else if (e.key === "ArrowRight") step("belly", 1);
  else if (e.key === "ArrowUp") { e.preventDefault(); step("wing", -1); } else if (e.key === "ArrowDown") { e.preventDefault(); step("wing", 1); }
  else if (e.key === " ") { e.preventDefault(); $("pause").click(); }
});
$("speed").oninput();
window.addEventListener("hashchange", () => location.reload());
fetch(base + "options.json", { cache: "no-store" }).then((r) => r.json()).then((d) => {
  opt = d; $("en").textContent = d.english_name || "Rig picker"; $("sci").textContent = d.scientific_name;
  document.title = `${d.english_name} · Rig Picker`;
  ib = Math.max(0, d.belly.findIndex((o) => o.code === d.current.belly));
  iw = Math.max(0, d.wing.findIndex((o) => o.code === d.current.wing));
  load();
}).catch(() => { $("en").textContent = `No options for "${sp}": run make_bird.py options first`; });
</script>
</body>
</html>
